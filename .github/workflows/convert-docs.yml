name: Convert Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'components/**/*.fodt'
      - 'libraries/**/*.fodt'
      - 'guides/**/*.fodt'
  workflow_dispatch:  # Allow manual triggering from GitHub UI (use for dev branch)

jobs:
  convert-and-sync:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/ecodocs-libreoffice:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write  # For source repo
      id-token: write  # For GitHub App token
      packages: read   # For container registry

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 50  # Needed for state-based git diff comparisons

    - name: Verify pre-built environment
      run: |
        echo "=== VERIFYING PRE-BUILT ENVIRONMENT ==="
        echo "🔍 LibreOffice version:"
        soffice --version
        echo "🔍 Python version:"
        python3 --version
        
        echo "🔍 Checking DocExport extension..."
        ext_count=$(unopkg list --shared 2>/dev/null | grep "^Identifier:" | grep -i docexport | wc -l)
        echo "   Found $ext_count DocExport extension package(s)"
        
        if [ $ext_count -eq 0 ]; then
          echo "❌ ERROR: DocExport extension not found"
          exit 1
        elif [ $ext_count -gt 1 ]; then
          echo "⚠️  WARNING: Multiple DocExport extensions detected ($ext_count instances)"
          echo "🧹 Attempting to clean up duplicate extensions..."
          
          # List all extensions for debugging
          echo "📋 Current extensions:"
          unopkg list --shared 2>/dev/null | head -20
          
          # Try to remove by identifier
          echo "🗑️  Removing all DocExport instances..."
          unopkg remove --shared org.openoffice.legacy.DocExport.oxt 2>/dev/null || true
          sleep 2
          
          # Check if removal worked
          remaining=$(unopkg list --shared 2>/dev/null | grep "^Identifier:" | grep -i docexport | wc -l)
          echo "   Extension packages remaining after removal: $remaining"
          
          if [ $remaining -gt 0 ]; then
            echo "⚠️  WARNING: Could not remove all duplicate extensions"
            echo "⚠️  Proceeding anyway - conversion script will provide detailed diagnostics"
          else
            # Reinstall single instance
            echo "📦 Reinstalling DocExport extension..."
            if [ -f ".github/workflows/DocExport.oxt" ]; then
              unopkg add --shared .github/workflows/DocExport.oxt
              new_count=$(unopkg list --shared 2>/dev/null | grep "^Identifier:" | grep -i docexport | wc -l)
              echo "   Extension packages after reinstall: $new_count"
              
              if [ $new_count -eq 1 ]; then
                echo "✓ Successfully cleaned up and reinstalled extension"
              else
                echo "⚠️  WARNING: Unexpected extension count after reinstall: $new_count"
              fi
            fi
          fi
        else
          echo "✓ DocExport extension found (single instance)"
        fi
        
        echo "✅ Environment verification complete"

    - name: Load Conversion State
      id: load-state
      run: |
        echo "=== LOADING CONVERSION STATE ==="
        
        # Clone target repo to check for existing state
        eval "$(ssh-agent -s)"
        echo "${{ secrets.VITEPRESS_DEPLOY_TOKEN }}" | ssh-add -
        
        if git clone git@github.com:peerf-eco/docs-vitepress.git state-check; then
          echo "✅ Target repository cloned for state check"
          
          if [ -f "state-check/.conversion-state.json" ]; then
            echo "📄 Found existing conversion state"
            cp state-check/.conversion-state.json ./current-state.json
            
            file_size=$(stat -c%s ./current-state.json 2>/dev/null || echo '0')
            echo "📊 State file size: $file_size bytes"
            
            # Validate state file is not empty or corrupted
            if [ "$file_size" -eq 0 ]; then
              echo "⚠️  State file is empty, creating fresh state"
              echo '{}' > ./current-state.json
              LAST_COMMIT=""
            else
              # Extract last processed commit with error handling
              LAST_COMMIT=$(python3 .github/workflows/load_state.py 2>/dev/null || echo "")
              
              # Validate state file structure
              if ! python3 -c "import json; json.load(open('current-state.json'))" 2>/dev/null; then
                echo "⚠️  State file is corrupted, creating fresh state"
                echo '{}' > ./current-state.json
                LAST_COMMIT=""
              else
                echo "✅ State file validated successfully"
              fi
            fi
            
            echo "🔍 Last processed commit: ${LAST_COMMIT:-'none'}"
            echo "LAST_PROCESSED_COMMIT=${LAST_COMMIT}" >> $GITHUB_ENV
            
            # Show current state summary
            python3 .github/workflows/show_state_summary.py 2>/dev/null || true
          else
            echo "ℹ️  No existing state found, creating initial state"
            echo '{}' > ./current-state.json
            echo "LAST_PROCESSED_COMMIT=" >> $GITHUB_ENV
          fi
        else
          echo "❌ Failed to clone target repository for state check"
          exit 1
        fi
        
        rm -rf state-check
        echo "=== STATE LOADING COMPLETE ==="

    - name: Debug Git State
      id: debug-git
      run: |
        echo "=== GIT STATE DEBUG ==="
        
        # Fix git ownership issue
        git config --global --add safe.directory /__w/EcoDocs/EcoDocs
        
        echo "Current commit (HEAD): $(git rev-parse HEAD)"
        echo "Previous commit (HEAD~1): $(git rev-parse HEAD~1 2>/dev/null || echo 'N/A - single commit')"
        echo "Last processed commit: ${LAST_PROCESSED_COMMIT:-'none'}"
        echo "Fetch depth used: 2"
        echo "Git log (last 3 commits):"
        git log --oneline -3 || echo "Less than 3 commits available"
        echo "Files in components directory:"
        find components -name "*.fodt" -type f | head -10 || echo "No .fodt files found"
        echo "Files in libraries directory:"
        find libraries -name "*.fodt" -type f | head -10 || echo "No .fodt files found"
        echo "Files in guides directory:"
        find guides -name "*.fodt" -type f | head -10 || echo "No .fodt files found"
        echo "=== END GIT STATE DEBUG ==="

    - name: Find changed files
      id: changed-files
      run: |
        echo "=== STATE-BASED CHANGE DETECTION ==="
        
        # For manual triggers (workflow_dispatch), process all existing .fodt files
        # This avoids cross-branch state confusion when dev and main have diverged
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "ℹ️  Manual trigger detected - processing all existing .fodt files (ignoring stored state)"
          CHANGED_FILES=$(find components libraries guides -name "*.fodt" -type f 2>/dev/null | tr '\n' ' ' | sed 's/ $//')
          echo "🔍 Debug: All .fodt files found: '$CHANGED_FILES'"
        elif [ -n "${LAST_PROCESSED_COMMIT}" ]; then
          echo "🔍 Using state-based detection from commit: ${LAST_PROCESSED_COMMIT}"
          
          # Verify the commit exists and try to fetch more history if needed
          echo "🔍 Debug: Checking if commit ${LAST_PROCESSED_COMMIT} exists..."
          echo "🔍 Debug: Current HEAD: $(git rev-parse HEAD)"
          echo "🔍 Debug: Git log showing recent commits:"
          git log --oneline -10 || echo "Failed to show git log"
          echo "🔍 Debug: Checking commit existence..."
          if git rev-parse --verify "${LAST_PROCESSED_COMMIT}" >/dev/null 2>&1; then
            echo "✅ Commit ${LAST_PROCESSED_COMMIT} exists"
            echo "🔍 Debug: Comparing commits ${LAST_PROCESSED_COMMIT}..$(git rev-parse HEAD)"
            echo "🔍 Debug: Running: git diff --name-only ${LAST_PROCESSED_COMMIT}..HEAD"
            # Get all changed files, then filter for .fodt files in components, libraries, and guides directories
            ALL_CHANGED=$(git diff --name-only ${LAST_PROCESSED_COMMIT}..HEAD 2>/dev/null || echo "")
            echo "🔍 Debug: Git diff exit code: $?"
            echo "🔍 Debug: All changed files: '$ALL_CHANGED'"
            echo "🔍 Debug: Number of changed files: $(echo "$ALL_CHANGED" | wc -w)"
            
            CHANGED_FILES=""
            for file in $ALL_CHANGED; do
              echo "🔍 Debug: Checking file: '$file'"
              case "$file" in
                components/*.fodt|components/*/*.fodt|components/*/*/*.fodt|libraries/*.fodt|libraries/*/*.fodt|libraries/*/*/*.fodt|guides/*.fodt|guides/*/*.fodt|guides/*/*/*.fodt)
                  echo "🔍 Debug: File matches pattern: '$file'"
                  CHANGED_FILES="$CHANGED_FILES $file"
                  ;;
                *)
                  echo "🔍 Debug: File does not match pattern: '$file'"
                  ;;
              esac
            done
            CHANGED_FILES=$(echo $CHANGED_FILES | sed 's/^ *//' | sed 's/ *$//')
            echo "🔍 Debug: Filtered .fodt files: '$CHANGED_FILES'"
            echo "✅ Successfully compared against last processed commit"
          else
            echo "❌ Commit ${LAST_PROCESSED_COMMIT} not found in current repository"
            echo "🔍 Debug: Trying to fetch more history..."
            
            # Try progressively deeper fetches until we find the commit
            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "main")
            for depth in 100 500 1000; do
              echo "🔍 Debug: Fetching depth $depth from ${CURRENT_BRANCH}..."
              git fetch --depth=$depth origin ${CURRENT_BRANCH} || echo "Failed to fetch depth $depth"
              if git rev-parse --verify "${LAST_PROCESSED_COMMIT}" >/dev/null 2>&1; then
                echo "✅ Found commit at depth $depth"
                break
              fi
            done
            
            # Final attempt with full history if still not found
            if ! git rev-parse --verify "${LAST_PROCESSED_COMMIT}" >/dev/null 2>&1; then
              echo "🔍 Debug: Fetching full history from ${CURRENT_BRANCH}..."
              git fetch --unshallow origin ${CURRENT_BRANCH} || echo "Failed to fetch full history"
            fi
            
            if git rev-parse --verify "${LAST_PROCESSED_COMMIT}" >/dev/null 2>&1; then
              echo "✅ Found commit after fetching more history"
              echo "🔍 Debug: Comparing commits ${LAST_PROCESSED_COMMIT}..$(git rev-parse HEAD)"
              echo "🔍 Debug: Running: git diff --name-only ${LAST_PROCESSED_COMMIT}..HEAD"
              ALL_CHANGED=$(git diff --name-only ${LAST_PROCESSED_COMMIT}..HEAD 2>/dev/null || echo "")
              echo "🔍 Debug: Git diff exit code: $?"
              echo "🔍 Debug: All changed files: '$ALL_CHANGED'"
              echo "🔍 Debug: Number of changed files: $(echo "$ALL_CHANGED" | wc -w)"
              
              CHANGED_FILES=""
              for file in $ALL_CHANGED; do
                echo "🔍 Debug: Checking file: '$file'"
                case "$file" in
                  components/*.fodt|components/*/*.fodt|components/*/*/*.fodt|libraries/*.fodt|libraries/*/*.fodt|libraries/*/*/*.fodt|guides/*.fodt|guides/*/*.fodt|guides/*/*/*.fodt)
                    echo "🔍 Debug: File matches pattern: '$file'"
                    CHANGED_FILES="$CHANGED_FILES $file"
                    ;;
                  *)
                    echo "🔍 Debug: File does not match pattern: '$file'"
                    ;;
                esac
              done
              CHANGED_FILES=$(echo $CHANGED_FILES | sed 's/^ *//' | sed 's/ *$//')
              echo "🔍 Debug: Filtered .fodt files: '$CHANGED_FILES'"
            else
              echo "⚠️  Last processed commit ${LAST_PROCESSED_COMMIT} still not found, falling back to HEAD~1"
              echo "🔍 Debug: Running git diff HEAD~1..HEAD to find changed .fodt files"
              # Get all changed files, then filter for .fodt files in components, libraries, and guides directories
              ALL_CHANGED=$(git diff --name-only HEAD~1..HEAD 2>/dev/null || echo "")
              CHANGED_FILES=""
              for file in $ALL_CHANGED; do
                case "$file" in
                  components/*.fodt|components/*/*.fodt|components/*/*/*.fodt|libraries/*.fodt|libraries/*/*.fodt|libraries/*/*/*.fodt|guides/*.fodt|guides/*/*.fodt|guides/*/*/*.fodt)
                    CHANGED_FILES="$CHANGED_FILES $file"
                    ;;
                esac
              done
              CHANGED_FILES=$(echo $CHANGED_FILES | sed 's/^ *//' | sed 's/ *$//')
              echo "🔍 Debug: Filtered .fodt files: '$CHANGED_FILES'"
            fi
          fi
        else
          echo "🔍 No previous state - initial run detected"
          echo "ℹ️  Processing all .fodt files matching workflow trigger pattern"
          echo "🔍 Path patterns: components/**/*.fodt, libraries/**/*.fodt, guides/**/*.fodt"
          CHANGED_FILES=$(find components libraries guides -name "*.fodt" -type f 2>/dev/null || echo "")
        fi
        
        echo "📊 Changed files found: $(echo "$CHANGED_FILES" | wc -w)"
        
        # Check for failed files from previous runs (with retry limit)
        FAILED_FILES=$(python3 .github/workflows/check_failed_files.py 2>/dev/null || echo "")
        
        failed_count=$(echo "$FAILED_FILES" | wc -w)
        if [ $failed_count -gt 0 ]; then
          echo "🔄 Including $failed_count previously failed files for retry (within retry limit)"
        fi
        
        # Combine changed and failed files
        ALL_FILES="${CHANGED_FILES} ${FAILED_FILES}"
        ALL_FILES=$(echo $ALL_FILES | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/ $//')
        
        if [ -n "$ALL_FILES" ]; then
          echo "any_changed=true" >> $GITHUB_OUTPUT
          echo "all_changed_files=$ALL_FILES" >> $GITHUB_OUTPUT
          echo "✅ Files to process: $ALL_FILES"
        else
          echo "any_changed=false" >> $GITHUB_OUTPUT
          echo "all_changed_files=" >> $GITHUB_OUTPUT
          echo "ℹ️  No files to process"
        fi
        
        echo "=== END STATE-BASED CHANGE DETECTION ==="

    - name: Process Change Detection Results
      run: |
        echo "=== CHANGE DETECTION RESULTS ==="
        echo "Any files changed: ${{ steps.changed-files.outputs.any_changed }}"
        echo "All changed files: ${{ steps.changed-files.outputs.all_changed_files }}"
        
        # Fix boolean comparison syntax
        if [ "${{ steps.changed-files.outputs.any_changed }}" = "true" ]; then
          file_count=$(echo '${{ steps.changed-files.outputs.all_changed_files }}' | wc -w)
          echo "✅ CHANGES DETECTED: $file_count file(s) to process"
          echo "Files to convert:"
          processable_files=0
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "  - $file"
            if [ -f "$file" ]; then
              file_size=$(stat -c%s "$file" 2>/dev/null || echo '0')
              echo "    ✅ File exists and is readable"
              echo "    📊 File size: $file_size bytes"
              
              if [ "$file_size" -eq 0 ]; then
                echo "    ⚠️  WARNING: File is empty (0 bytes)"
              elif [ "$file_size" -lt 100 ]; then
                echo "    ⚠️  WARNING: File is very small ($file_size bytes) - may be incomplete"
              fi
              processable_files=$((processable_files + 1))
            else
              echo "    ❌ WARNING: File not found or not readable (likely deleted)"
            fi
          done
          
          echo "📊 Summary: $processable_files processable files out of $file_count total changes"
        else
          echo "ℹ️  NO CHANGES DETECTED"
          echo "Reason: No .fodt files in components/**, libraries/**, or guides/** have been modified since the last commit"
          echo "This is normal behavior - the workflow will skip conversion steps"
          
          # Additional debugging for no-changes scenario
          echo "🔍 Additional debugging information:"
          echo "  - Current workflow path filters: components/**/*.fodt, libraries/**/*.fodt, guides/**/*.fodt"
          echo "  - Comparison method: State-based or HEAD~1 fallback"
          echo "  - Repository has $(git rev-list --count HEAD 2>/dev/null || echo 'unknown') total commits"
        fi
        echo "=== END CHANGE DETECTION RESULTS ==="

    - name: No Changes Detected
      if: steps.changed-files.outputs.any_changed == 'false'
      run: |
        echo "=== NO CONVERSION NEEDED ==="
        echo "ℹ️  WORKFLOW RESULT: No changes detected"
        echo ""
        echo "This means:"
        echo "  • No .fodt files in components/**, libraries/**, or guides/** have been modified since the last commit"
        echo "  • The workflow is working correctly by skipping unnecessary conversions"
        echo "  • No files will be converted or pushed to the target repository"
        echo ""
        echo "If you expected changes to be detected:"
        echo "  1. Verify your .fodt files are in the components/, libraries/, or guides/ directories"
        echo "  2. Check that files were actually modified in the last commit"
        echo "  3. Ensure the workflow path filters match your file locations"
        echo ""
        echo "Current workflow path filters: components/**/*.fodt, libraries/**/*.fodt, guides/**/*.fodt"
        echo "=== WORKFLOW COMPLETE (NO ACTION REQUIRED) ==="

    - name: Convert to Markdown
      id: convert
      if: steps.changed-files.outputs.any_changed == 'true'
      timeout-minutes: 15
      run: |
        echo "=== CONVERSION START ==="
        file_count=$(echo '${{ steps.changed-files.outputs.all_changed_files }}' | wc -w)
        echo "🔄 Starting conversion of $file_count file(s)"
        echo "Files to convert: ${{ steps.changed-files.outputs.all_changed_files }}"
        
        # Export GitHub environment variables for the script
        echo "GITHUB_SERVER_URL=${{ github.server_url }}" >> $GITHUB_ENV
        echo "GITHUB_REPOSITORY=${{ github.repository }}" >> $GITHUB_ENV
        echo "GITHUB_SHA=${{ github.sha }}" >> $GITHUB_ENV
        
        # Create converted_docs directory and list contents before conversion
        mkdir -p converted_docs
        echo "Contents before conversion:"
        ls -la converted_docs/ || echo "Directory is empty"
        
        # Call the extension-based conversion script with ALL files as arguments
        echo "🚀 Executing batch conversion script..."
        
        # Filter out non-existent files
        EXISTING_FILES=""
        for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
          if [ -f "$file" ]; then
            EXISTING_FILES="$EXISTING_FILES $file"
          else
            echo "⚠️  Skipping non-existent file: $file"
          fi
        done
        
        if [ -n "$EXISTING_FILES" ]; then
          echo "🔄 Processing files: $EXISTING_FILES"
          bash .github/workflows/convert_docs_extension.sh $EXISTING_FILES
        else
          echo "❌ No valid files to process"
          exit 1
        fi
        
    - name: Verify Conversion Results
      if: steps.changed-files.outputs.any_changed == 'true'
      run: |
        echo "=== CONVERSION VERIFICATION ==="
        
        if [ -d "converted_docs" ]; then
          echo "📁 Converted docs directory contents:"
          ls -la converted_docs/
          
          md_count=$(find converted_docs -name "*.md" | wc -l)
          echo "📄 Total .md files created: $md_count"
          
          if [ $md_count -gt 0 ]; then
            echo "✅ Conversion successful - found $md_count markdown file(s)"
            echo "📋 Generated files:"
            find converted_docs -name "*.md" -exec basename {} \; | sort
            
            echo "📊 File sizes:"
            find converted_docs -name "*.md" -exec ls -lh {} \; | awk '{print "  " $9 ": " $5}'
          else
            echo "⚠️  WARNING: No markdown files were created"
            echo "🔍 Checking for other file types:"
            find converted_docs -type f | head -10
          fi
        else
          echo "❌ ERROR: converted_docs directory not found"
          echo "🔍 Current directory contents:"
          ls -la
          exit 1
        fi
        echo "=== END CONVERSION VERIFICATION ==="

    - name: Update Conversion State
      id: update-state
      if: steps.changed-files.outputs.any_changed == 'true'
      run: |
        echo "=== UPDATING CONVERSION STATE ==="
        
        # Create new state with corrected logic
        python3 .github/workflows/update_state.py
        
        echo "📊 New state file created:"
        ls -la new-state.json
        echo "📄 State summary:"
        python3 -c "import json; s=json.load(open('new-state.json')); print(f'Successful: {len(s.get(\"successfulFiles\",{}))} Failed: {len(s.get(\"failedFiles\",{}))} Commit: {s.get(\"lastProcessedCommit\",\"none\")}')"
        echo "=== STATE UPDATE COMPLETE ==="

    - name: Clone, copy files, and push to docs repo
      id: deploy
      if: steps.changed-files.outputs.any_changed == 'true'
      env:
        TARGET_REPO_SSH_KEY: ${{ secrets.VITEPRESS_DEPLOY_TOKEN }}
      shell: bash
      run: |
        set -euo pipefail
        echo "=== DEPLOYMENT TO TARGET REPOSITORY START ==="
        echo "🎯 Target repository: peerf-eco/docs-vitepress"
        echo "📂 Source directory: converted_docs/"
        echo "📂 Target directories: docs/components/, docs/libraries/, docs/guides/"
        
        # Setup SSH
        echo "🔐 Setting up SSH authentication..."
        if mkdir -p ~/.ssh; then
          echo "✅ SSH directory created"
        else
          echo "❌ Failed to create SSH directory"
          exit 1
        fi
        
        echo "🔑 Adding GitHub to known hosts..."
        if ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts; then
          echo "✅ GitHub added to known hosts"
        else
          echo "❌ Failed to add GitHub to known hosts"
          exit 1
        fi
        
        echo "🔑 Starting SSH agent..."
        if eval "$(ssh-agent -s)"; then
          echo "✅ SSH agent started"
        else
          echo "❌ Failed to start SSH agent"
          exit 1
        fi
        
        echo "🔑 Adding SSH key..."
        if echo "$TARGET_REPO_SSH_KEY" | ssh-add -; then
          echo "✅ SSH key added successfully"
        else
          echo "❌ Failed to add SSH key"
          echo "🔍 SSH key length: ${#TARGET_REPO_SSH_KEY} characters"
          exit 1
        fi
        
        # Clone and copy files
        echo "💾 Cloning target repository..."
        if git clone git@github.com:peerf-eco/docs-vitepress.git docs-vitepress; then
          echo "✅ Repository cloned successfully"
          echo "📁 Cloned repository contents:"
          ls -la docs-vitepress/ | head -10
        else
          echo "❌ Failed to clone repository"
          echo "🔍 Testing SSH connection to GitHub:"
          ssh -T git@github.com || echo "SSH connection test failed"
          exit 1
        fi
        
        # Verify source directory exists
        if [ ! -d "converted_docs" ]; then
          echo "❌ ERROR: converted_docs directory not found"
          exit 1
        fi
        
        echo "📋 Files available for deployment:"
        ls -la converted_docs/
        
        # Check for image folders
        echo "🖼️ Checking for image folders..."
        img_folders_found=$(find converted_docs -type d -name "img_*" | wc -l)
        if [ $img_folders_found -gt 0 ]; then
          echo "  ✅ Found $img_folders_found image folder(s)"
        else
          echo "  ℹ️ No image folders found (img_* pattern)"
        fi
        
        # Create target directories for all supported languages
        for lang in en ru fr de; do
          mkdir -p "docs-vitepress/docs/$lang/components"
          mkdir -p "docs-vitepress/docs/$lang/libraries"
          mkdir -p "docs-vitepress/docs/$lang/guides"
        done
        echo "📁 Created target directories for languages: en, ru, fr, de"
        
        filesCopied=0
        filesSkipped=0
        imagesFoldersCopied=0
        echo "🔄 Starting file copy process..."
        
        # Copy all files preserving language and directory structure
        for lang_dir in converted_docs/*; do
          if [ -d "$lang_dir" ]; then
            lang=$(basename "$lang_dir")
            echo "🌐 Processing language: $lang"
            
            if [ -d "$lang_dir/components" ]; then
              echo "  📁 Copying $lang components files..."
              if cp -r "$lang_dir/components"/* "docs-vitepress/docs/$lang/components/" 2>/dev/null; then
                components_count=$(find "$lang_dir/components" -name "*.md" -type f | wc -l)
                echo "    ✅ Copied $components_count components files"
                filesCopied=$((filesCopied + components_count))
              fi
            fi
            
            if [ -d "$lang_dir/libraries" ]; then
              echo "  📁 Copying $lang libraries files..."
              if cp -r "$lang_dir/libraries"/* "docs-vitepress/docs/$lang/libraries/" 2>/dev/null; then
                libraries_count=$(find "$lang_dir/libraries" -name "*.md" -type f | wc -l)
                echo "    ✅ Copied $libraries_count libraries files"
                filesCopied=$((filesCopied + libraries_count))
              fi
            fi
            
            if [ -d "$lang_dir/guides" ]; then
              echo "  📁 Copying $lang guides files..."
              if cp -r "$lang_dir/guides"/* "docs-vitepress/docs/$lang/guides/" 2>/dev/null; then
                guides_count=$(find "$lang_dir/guides" -name "*.md" -type f | wc -l)
                echo "    ✅ Copied $guides_count guides files"
                filesCopied=$((filesCopied + guides_count))
              fi
            fi
          fi
        done
        
        echo "📊 Copy summary: $filesCopied files copied, $imagesFoldersCopied image folders copied"
        
        if [ $filesCopied -eq 0 ]; then
          echo "⚠️  WARNING: No files were copied to target repository"
        fi
        
        if [ $imagesFoldersCopied -gt 0 ]; then
          echo "✅ Successfully copied $imagesFoldersCopied image folder(s) with markdown files"
        fi
        
        # Push changes
        pushd docs-vitepress >/dev/null
        git config user.name "Docs CI Bot"
        git config user.email "docs-bot@ecoos.dev"
        git add docs/*/components/ docs/*/libraries/ docs/*/guides/
        # Copy state file to target repository with validation
        if [ -f "../new-state.json" ]; then
          echo "📄 Copying conversion state to target repository"
          
          # Validate state file before copying
          if python3 -c "import json; json.load(open('../new-state.json'))" 2>/dev/null; then
            cp ../new-state.json .conversion-state.json
            echo "✅ State file copied and validated"
            echo "📊 New state file size: $(stat -c%s .conversion-state.json) bytes"
            git add .conversion-state.json
          else
            echo "❌ State file validation failed, not copying corrupted state"
            # Keep existing state file if new one is corrupted
            if [ -f ".conversion-state.json" ]; then
              echo "ℹ️  Keeping existing state file"
            fi
          fi
        else
          echo "⚠️  No new state file found, state will not be updated"
          # This is an edge case that shouldn't happen if update-state step succeeded
        fi
        
        # Check for changes and commit
        echo "🔍 Checking for changes in target repository..."
        git status --porcelain docs/*/components/ docs/*/libraries/ docs/*/guides/ .conversion-state.json
        
        if ! git diff --staged --quiet; then
          sha="${GITHUB_SHA:-unknown-sha}"
          echo "✅ Changes detected, committing and pushing..."
          echo "📝 Commit message: Auto-update docs from ${sha}"
          git commit -m "Auto-update docs from ${sha}"
          
          if git push origin HEAD:main; then
            echo "🚀 Successfully pushed to docs-vitepress repository"
          else
            echo "❌ Failed to push to target repository"
            exit 1
          fi
        else
          echo "ℹ️  No changes to commit - files may already be up to date"
        fi
        popd >/dev/null
        echo "=== DEPLOYMENT COMPLETE ==="
  


    - name: Generate USPD Registry
      if: steps.changed-files.outputs.any_changed == 'true'
      run: |
        echo "=== GENERATING USPD REGISTRY ==="
        python3 .github/workflows/generate_registry.py
        
        if [ -f "USPD_REGISTRY.md" ]; then
          echo "✅ Registry generated successfully"
          echo "📊 Registry file size: $(stat -c%s USPD_REGISTRY.md) bytes"
          
          # Check if file actually changed
          if git diff --exit-code USPD_REGISTRY.md >/dev/null 2>&1; then
            echo "ℹ️  Registry unchanged, no commit needed"
          else
            echo "📝 Registry has changes, committing..."
            git config user.name "Docs CI Bot"
            git config user.email "docs-bot@ecoos.dev"
            git add USPD_REGISTRY.md
            git commit -m "Auto-update USPD registry [skip ci]"
            echo "✅ Registry pushed to source repository"
          fi
        else
          echo "⚠️  Registry file not generated"
        fi
        echo "=== REGISTRY GENERATION COMPLETE ==="

    - name: Workflow Summary
      if: always()
      run: |
        echo "=== WORKFLOW EXECUTION SUMMARY ==="
        echo "📅 Execution date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        echo "🌐 Repository: ${{ github.repository }}"
        echo "🔗 Commit: ${{ github.sha }}"
        echo "🏃 Triggered by: ${{ github.event_name }}"
        echo "🕰️ Workflow run ID: ${{ github.run_id }}"
        
        # Check step outcomes
        echo "🔍 Step execution status:"
        echo "  - Git state debug: ${{ steps.debug-git.outcome || 'not executed' }}"
        echo "  - Change detection: ${{ steps.changed-files.outcome || 'not executed' }}"
        echo "  - Conversion: ${{ steps.convert.outcome || 'skipped' }}"
        echo "  - Deployment: ${{ steps.deploy.outcome || 'skipped' }}"

        
        # Overall workflow status
        if [ "${{ job.status }}" = "success" ]; then
          echo "✅ WORKFLOW STATUS: SUCCESS"
        elif [ "${{ job.status }}" = "failure" ]; then
          echo "❌ WORKFLOW STATUS: FAILED"
          echo "🔍 Check the failed steps above for error details"
        elif [ "${{ job.status }}" = "cancelled" ]; then
          echo "⚠️  WORKFLOW STATUS: CANCELLED"
        else
          echo "🔄 WORKFLOW STATUS: ${{ job.status }}"
        fi
        
        # File processing summary
        if [ "${{ steps.changed-files.outputs.any_changed }}" = "true" ]; then
          echo "🟢 PROCESSING RESULT: CHANGES DETECTED AND PROCESSED"
          echo "📄 Files in scope: $(echo '${{ steps.changed-files.outputs.all_changed_files }}' | wc -w)"
          echo "🎯 Target repository: peerf-eco/docs-vitepress"
          
          # State tracking summary
          if [ -f "new-state.json" ]; then
            echo "📄 State tracking summary:"
            python3 -c "import json; s=json.load(open('new-state.json')); print(f'  - Files: {len(s.get(\"successfulFiles\",{}))} success, {len(s.get(\"failedFiles\",{}))} failed')" 2>/dev/null || echo "  - State unavailable"
          fi
          
          # Check if conversion actually succeeded
          if [ "${{ steps.convert.outcome }}" = "success" ]; then
            echo "✅ Conversion completed successfully"
          elif [ "${{ steps.convert.outcome }}" = "failure" ]; then
            echo "❌ Conversion failed - check conversion logs"
          fi
          
          # Check if deployment succeeded
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "✅ Deployment completed successfully"
          elif [ "${{ steps.deploy.outcome }}" = "failure" ]; then
            echo "❌ Deployment failed - check deployment logs"
          fi
          
          # Check if state update succeeded
          if [ "${{ steps.update-state.outcome }}" = "success" ]; then
            echo "✅ State tracking updated successfully"
          elif [ "${{ steps.update-state.outcome }}" = "failure" ]; then
            echo "❌ State tracking update failed"
          fi
        else
          echo "🟡 PROCESSING RESULT: NO CHANGES DETECTED"
          echo "📄 Files processed: 0"
          echo "🎯 Target repository: No updates needed"
          
          # Show current state even when no changes
          if [ -f "current-state.json" ]; then
            echo "📄 Current state summary:"
            python3 -c "import json; s=json.load(open('current-state.json')); print(f'  - Files: {len(s.get(\"successfulFiles\",{}))} success, {len(s.get(\"failedFiles\",{}))} failed')" 2>/dev/null || echo "  - No state available"
          fi
        fi
        
        # Troubleshooting guidance
        if [ "${{ job.status }}" != "success" ]; then
          echo ""
          echo "🔧 TROUBLESHOOTING GUIDANCE:"
          echo "  1. Check the step-by-step logs above for specific error messages"
          echo "  2. Look for ❌ (error) and ⚠️ (warning) indicators in the logs"
          echo "  3. Verify that .fodt files exist in the components/ directory"
          echo "  4. Ensure SSH keys and repository permissions are correct"
          echo "  5. Check if LibreOffice and DocExport extension installed properly"
        fi
        
        echo "🔍 For detailed logs, check the individual step outputs above"
        echo "=== END WORKFLOW SUMMARY ==="
